name: calda_feedback
description: "A new Flutter package project."
version: 0.0.3
homepage:

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/

  fonts:
    - family: PPNeueMontreal
      fonts:
        - asset: fonts/PPNeueMontreal-Book.otf
          weight: 400
        - asset: fonts/PPNeueMontreal-Medium.otf
          weight: 500
        - asset: fonts/PPNeueMontreal-Bold.otf
          weight: 700
